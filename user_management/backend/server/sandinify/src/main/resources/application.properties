spring.application.name=sandinify

#SQL SERVER
spring.datasource.url=jdbc:postgresql://localhost:5432/sandinify
spring.datasource.username=postgres
spring.config.import=optional:file:./secret.properties,optional:file:./user_management/backend/server/sandinify/secret.properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Allow MP3 uploads up to 10 MB; multipart framing requires extra request space.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

#AWS S3
app.s3.bucket-name=${AWS_BUCKET_NAME}
app.s3.region=${AWS_REGION}
app.s3.access-key=${AWS_ACCESS_KEY_ID}
app.s3.secret-key=${AWS_SECRET_ACCESS_KEY}