services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sandinify
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7
  #Create container for Jaeger to visualize and conect to OpenTelemetry. WE can reach it directly under docker-compose
  jaeger:
    image: jaegertracing/all-in-one:1.49
    ports:
      - "16686:16686"
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sandinify
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}

    # OpenTelemetry configuration. Export to Jeager running in the same docker-compose network
      OTEL_SERVICE_NAME: sandinify-auth
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  

volumes:
  pgdata:

