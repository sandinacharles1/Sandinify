spring.application.name=sandinify

#SQL SERVER
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sandinify}
spring.datasource.username=postgres
spring.config.import=optional:file:./secret.properties,optional:file:./backend/secret.properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Allow MP3 uploads up to 10 MB; multipart framing requires extra request space.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

#AWS S3
app.s3.bucket-name=${AWS_BUCKET_NAME}
app.s3.region=${AWS_REGION}
app.s3.access-key=${AWS_ACCESS_KEY_ID}
app.s3.secret-key=${AWS_SECRET_ACCESS_KEY}