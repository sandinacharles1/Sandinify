name: Sandinify Tests CI

on: #Run whenever theres's a push or pull request.
  push:
  pull_request:

jobs:
  test: #Run the tests on these configs
    runs-on: ubuntu-latest
    env:
      AWS_BUCKET_NAME: test-bucket
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test-access-key
      AWS_SECRET_ACCESS_KEY: test-secret-key
    steps:
      - uses: actions/checkout@v4 #checkout the entire repository (and monitor version)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests #Automaatically run the tests in the bproper server
        working-directory: user_management/backend/server/sandinify
        run: ./mvnw test